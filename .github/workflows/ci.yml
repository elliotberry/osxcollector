name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-13]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e '.[dev,macho]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Typecheck
        run: mypy
      - name: Test
        run: pytest --cov=osxcollector --cov-report=term-missing tests

  smoke:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e .
      - name: List sections
        run: python -m osxcollector --list-sections
      - name: Offline smoke against fixture root
        run: |
          mkdir -p /tmp/osxcollector-root/Users/test
          python -m osxcollector -p /tmp/osxcollector-root -s version -s system_info --outdir /tmp/osxcollector-out --no-archive -i smoke
          test -d /tmp/osxcollector-out/smoke-*
